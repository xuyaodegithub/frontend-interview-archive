<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按专题复习前端面试题，搜索答案、练习手写题、收藏并追踪进度。">
  <meta name="theme-color" content="#f7f8fc">
  <title>前端面试题库</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./questions.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="#home" aria-label="前端面试题库首页">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span>前端面试题库</span>
      </a>
      <form id="header-search" class="search" role="search">
        <label class="visually-hidden" for="keyword">搜索题目、题号和答案</label>
        <span class="icon icon-search" aria-hidden="true"></span>
        <input type="search" id="keyword" placeholder="搜索题目、题号和答案" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </form>
      <a class="header-saved" href="#saved"><span class="icon icon-bookmark" aria-hidden="true"></span>我的收藏</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav id="sidebar" aria-label="题库导航"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <noscript><p>请启用 JavaScript 浏览题库。</p></noscript>
    </main>
  </div>
  <p id="live-message" class="visually-hidden" role="status"></p>
</body>
</html>
